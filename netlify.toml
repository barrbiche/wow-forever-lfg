[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Le service worker ne doit jamais rester en cache: une nouvelle version doit passer tout de suite.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
