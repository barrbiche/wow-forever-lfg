[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Le service worker ne doit jamais rester en cache: une nouvelle version doit passer tout de suite.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Les fichiers de /assets ont un nom qui change à chaque version: cache long sans risque.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
