<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090e19" media="(prefers-color-scheme: light)" data-defaut="#090e19" />
    <meta name="theme-color" content="#090e19" media="(prefers-color-scheme: dark)" data-defaut="#090e19" />
    <meta name="description" content="Trouve du monde pour tes donjons et ton PvP dans WoW Forever. Annonce ton groupe ou rejoins-en un." />
    <!-- Aperçu du lien dans Discord, Facebook, Messenger, etc. À changer ici si le site prend un nom de domaine. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babillard Forever" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="Babillard Forever" />
    <meta property="og:description" content="Trouve ton groupe pour les donjons, les raids et le PvP. Pour le Québec et la francophonie." />
    <meta property="og:url" content="https://babillard-forever.netlify.app/" />
    <meta property="og:image" content="https://babillard-forever.netlify.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Babillard Forever, trouve ton groupe pour les donjons, les raids et le PvP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Cinzel:wght@700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Babillard Forever</title>
    <script>
      // Applique le style choisi (Alliance ou Horde) avant l'affichage, pour éviter un flash de couleurs.
      try {
        var s = localStorage.getItem('forever-style')
        if (s === 'alliance' || s === 'horde') {
          document.documentElement.dataset.style = s
          var couleur = s === 'horde' ? '#0b0404' : '#071229'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', couleur) })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
