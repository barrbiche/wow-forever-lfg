<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0F1B" />
    <meta name="description" content="Trouve du monde pour tes donjons et ton PvP dans WoW Forever. Annonce ton groupe ou rejoins-en un." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Cinzel:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Babillard Forever</title>
    <script>
      // Applique le style choisi (Alliance ou Horde) avant l'affichage, pour éviter un flash de couleurs.
      try {
        var s = localStorage.getItem('forever-style')
        if (s === 'alliance' || s === 'horde') {
          document.documentElement.dataset.style = s
          document.querySelector('meta[name="theme-color"]').setAttribute('content', s === 'horde' ? '#0b0404' : '#071229')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
